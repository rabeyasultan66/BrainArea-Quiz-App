<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BrainArea | Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

        body{
  background-image: url("img/dg.jpg"); /* path ঠিক করো */
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  min-height: 100vh;
  position: relative;
}

/* dark overlay */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  z-index:-1;
}

    .navbar {
      background: #3f7efc;
      padding: 15px 40px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar h2 {
      font-size: 22px;
    }

    .navbar a {
      color: #fff;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 500;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 70px);
    }

    .box {
      background: #fff;
      width: 380px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    .box h1 {
      color: #3f7efc;
      margin-bottom: 10px;
    }

    .box p {
      font-size: 14px;
      margin-bottom: 20px;
      color: #555;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #3f7efc;
      border: none;
      color: #fff;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #2f6be0;
    }

    .link {
      margin-top: 15px;
      font-size: 14px;
    }

    .link a {
      color: #3f7efc;
      text-decoration: none;
      font-weight: 500;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <h2>BrainArea</h2>
    <div>
      <a href="login.html">Login</a>
      <a href="signup.html">Sign Up</a>
    </div>
  </div>

 <div class="container">
  <div class="box">
    <h1>Create Account</h1>
    <p>Join BrainArea and test your knowledge</p>

    <form action="auth/signup.php" method="POST">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <input type="password" name="confirm_password" placeholder="Confirm Password" required>

      <button type="submit">Sign Up</button>
    </form>

    <div class="link">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>
</div>


  <footer>
    © 2025 BrainArea — Quiz Learning Platform
  </footer>

</body>
</html>
